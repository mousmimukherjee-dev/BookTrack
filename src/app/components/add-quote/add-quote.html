<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card bg-dark text-light border-secondary shadow">

        <div class="card-body p-4">

          <h2 class="fw-bold mb-2">
            <i class="fa-solid fa-quote-left text-primary me-2"></i>
            Add Quote
          </h2>

          <p class="text-secondary mb-4">
            Save an inspiring quote to your collection.
          </p>

          <form>

            <!-- Quote -->
            <div class="mb-3">
              <label for="quoteText" class="form-label">
                Quote text
              </label>

              <textarea
                id="quoteText"
                rows="5"
                class="form-control bg-dark text-light border-secondary"
                placeholder="Enter your quote..."
              ></textarea>
            </div>

            <!-- Author -->
            <div class="mb-4">
              <label for="quoteAuthor" class="form-label">
                Author
              </label>

              <input
                type="text"
                id="quoteAuthor"
                class="form-control bg-dark text-light border-secondary"
                placeholder="Enter author name"
              >
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-end gap-2">

              <button
                type="button"
                class="btn btn-outline-secondary"
              >
                Cancel
              </button>

              <button
                type="submit"
                class="btn btn-primary"
              >
                <i class="fa-solid fa-plus me-2"></i>
                Add Quote
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>
  </div>

</div>
