<div class="home">
 <div class="d-flex justify-content-between gap-3 mb-4 btn-cont ">
  <button class="button" (click) = "showLogin()"><i class="fa-solid fa-right-to-bracket "></i> Sign In</button>
  <button class="button" (click) = "showRegister()"><i class="fa-solid fa-user-plus "></i> Register</button>
</div>

@if(activeButton() == "Sign In"){
  
  <form class="login-form">
  <div class="form-group">
    <label for="username" class="form-label">Username</label>
    <input
      type="text"
      id="username"
      placeholder="Enter username"
      class="form-control"
    >
  </div>

  <div class="form-group">
    <label for="password" class="form-label">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
      class="form-control"
    >
  </div>

  <button type="submit" class="button-blue">
    <i class="fa-solid fa-right-to-bracket"></i> Sign In
  </button>
</form>
}@else{

  <form class="register-form">
  <div class="form-group">
    <label for="username" class="form-label">Choose username</label>
    <input
      type="text"
      id="username"
      placeholder="Choose username"
      class="form-control"
    >
  </div>

  <div class="form-group">
    <label for="password" class="form-label">Choose password</label>
    <input
      type="password"
      id="password"
      placeholder="Choose password"
      class="form-control"
    >
  </div>
  <div class="form-group">
    <label for="password" class="form-label">Confirm passwor</label>
    <input
      type="password"
      id="password"
      placeholder="Repeat password"
      class="form-control"
    >
  </div>

  <button type="submit" class="button-blue">
    <i class="fa-solid fa-right-to-bracket"></i> Sign In
  </button>
</form>

}


</div>
