<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card bg-dark text-light border-secondary shadow">
        <div class="card-body p-4">
          <h2 class="fw-bold mb-2">
            <i class="fa-solid fa-book-open text-primary me-2"></i>
            Add New Book
          </h2>
          <p class="text-secondary mb-4">Fill in the details to add a book to the library.</p>
          <form>
            <div class="mb-3">
              <label for="title" class="form-label"> Title </label>
              <input
                type="text"
                id="title"
                class="form-control bg-dark text-light border-secondary"
                placeholder="Enter book title"
              />
            </div>
            <div class="mb-3">
              <label for="author" class="form-label"> Author </label>
              <input
                type="text"
                id="author"
                class="form-control bg-dark text-light border-secondary"
                placeholder="Enter author name"
              />
            </div>
            <div class="mb-3">
              <label for="publicationDate" class="form-label"> Publication Date </label>

              <input
                type="date"
                id="publicationDate"
                class="form-control bg-dark text-light border-secondary"
              />
            </div>
            <small class="text-secondary d-block mb-4"> All fields are required. </small>
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-secondary">Cancel</button>
              <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-plus me-2"></i>
                Add Book
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
