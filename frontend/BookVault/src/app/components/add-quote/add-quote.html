<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card border-secondary shadow">
        <div class="card-body p-4">

          <h2 class="fw-bold mb-2">
            <i class="fa-solid fa-quote-left text-primary me-2"></i>
            Add New Quote
          </h2>

          <p class="text-secondary mb-4">
            Add your favorite quote to your collection.
          </p>

          <form (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label for="quoteText" class="form-label">
                Quote
              </label>

              <textarea
                id="quoteText"
                name="text"
                rows="5"
                class="form-control border-secondary"
                placeholder="Enter your quote..."
                [(ngModel)]="quoteData.text"
              ></textarea>
            </div>

            <div class="mb-3">
              <label for="quoteAuthor" class="form-label">
                Author
              </label>

              <input
                type="text"
                id="quoteAuthor"
                name="author"
                class="form-control border-secondary"
                placeholder="Enter author name"
                [(ngModel)]="quoteData.author"
              />
            </div>

            <small class="text-secondary d-block mb-4">
              All fields are required.
            </small>

            <div class="d-flex justify-content-end gap-2">

              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="onCancel()"
              >
                Cancel
              </button>

              <button
                type="submit"
                class="btn btn-primary"
              >
                <i class="fa-solid fa-plus me-2"></i>
                Add Quote
              </button>

            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
